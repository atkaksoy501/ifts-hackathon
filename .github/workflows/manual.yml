name: Manual Task

on:
  workflow_dispatch:
    inputs:
      task_name:
        description: "Which app workflow task to run"
        type: choice
        required: true
        default: quality
        options:
          - lint
          - build
          - test
          - coverage
          - quality
          - all

permissions:
  contents: read

jobs:
  manual-task:
    name: Manual Task
    runs-on:
      - self-hosted
      - macOS
      - ARM64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Show task input
        run: |
          echo "Requested task: ${{ inputs.task_name }}"
          node --version
          pnpm --version

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Run requested task
        working-directory: app
        env:
          TASK_NAME: ${{ inputs.task_name }}
        run: |
          case "$TASK_NAME" in
            lint|build|test|coverage|quality)
              pnpm "$TASK_NAME"
              ;;
            all)
              pnpm lint
              pnpm build
              pnpm test
              pnpm coverage
              ;;
            *)
              echo "Unsupported task: $TASK_NAME" >&2
              exit 1
              ;;
          esac
