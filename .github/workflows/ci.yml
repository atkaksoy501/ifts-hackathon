name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basic-check:
    name: Basic Check
    runs-on:
      - self-hosted
      - macOS
      - ARM64
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'http://localhost:9000' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show runner context
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Workspace: $GITHUB_WORKSPACE"
          node --version
          pnpm --version
          python --version

      - name: Install app dependencies
        working-directory: app
        run: |
          pnpm install --frozen-lockfile

      - name: Lint app
        working-directory: app
        run: pnpm lint

      - name: Build app
        working-directory: app
        run: pnpm build

      - name: Run unit and integration tests
        working-directory: app
        run: pnpm test

      - name: Run coverage thresholds
        working-directory: app
        run: pnpm coverage

      - name: Run SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.projectBaseDir=app

      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Run Semgrep analysis
        run: semgrep scan --config auto --error --metrics=off .
